name: deploy-vercel
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/deploy_vercel.py"
      - ".github/workflows/vercel-deploy.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare prebuilt output and anonymous project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: prj_v7W5RM5K01gTKAwDA1q5SZPgjK7D
        run: |
          rm -rf .vercel
          mkdir -p .vercel
          cp -r vercel-prebuilt/output .vercel/output
          python - <<'PY'
          import json, os
          with open('.vercel/anonymous.json','w') as f:
              json.dump({'projectId': os.environ['VERCEL_PROJECT'], 'token': os.environ['VERCEL_TOKEN']}, f)
          PY
      - name: Deploy with Vercel CLI
        run: npx --yes vercel@61.1.0 deploy --prebuilt --yes --force
