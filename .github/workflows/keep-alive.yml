name: Keep Render Backend Alive

# 每 10 分钟 ping 一次后端，防止 Render 免费版休眠
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            --max-time 60 \
            https://universal-pay-backend.onrender.com/api/health
